server {
 listen 80;
 root /usr/share/nginx/html;
 location /vendor/ { types { application/javascript mjs; } etag off; if_modified_since off; add_header Cache-Control "no-store" always; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 90s; }
 location /metrics { proxy_pass http://backend:8080; }
}
